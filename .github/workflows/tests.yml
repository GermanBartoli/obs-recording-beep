name: Pruebas Lua
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Verificar el comportamiento
        run: luajit tests/recording_beep_spec.lua
